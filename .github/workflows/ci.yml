name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Linting, Typing & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install project dependencies
        run: uv sync --dev

      - name: Check code formatting (Ruff)
        run: uv run ruff format --check .

      - name: Lint codebase (Ruff)
        run: uv run ruff check .

      - name: Static type check (Mypy Strict)
        run: uv run mypy --strict app

      - name: Run tests with coverage threshold
        run: uv run pytest -s --cov=app --cov-branch --cov-fail-under=85 tests/
