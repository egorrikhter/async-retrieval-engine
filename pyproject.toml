[project]
name = "async-retrieval-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
reportAny = "none"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "mypy>=2.4.1",
    "pgvector>=0.5.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "testcontainers>=4.15.0",
]


[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (сортировка импортов)
    "UP",     # pyupgrade (синтаксис Python 3.12+, например StrEnum)
    "B",      # flake8-bugbear (поиск частых багов и антипаттернов)
    "ASYNC",  # flake8-async (проверка асинхронного кода)
    "SIM",    # flake8-simplify (упрощение избыточных конструкций)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
